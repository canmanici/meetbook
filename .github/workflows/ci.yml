name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: meetbook
          POSTGRES_PASSWORD: meetbook_dev
          POSTGRES_DB: meetbook
        ports: ["5436:5432"]
        options: >-
          --health-cmd "pg_isready -U meetbook" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://meetbook:meetbook_dev@localhost:5436/meetbook
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret
      # Default /app/media only exists inside the container (not writable here).
      MEDIA_DIR: /tmp/meetbook-media
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run python scripts/check_alembic_heads.py
      - run: uv run alembic upgrade head
      - run: uv run pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
