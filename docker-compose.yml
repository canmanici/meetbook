services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: meetbook
      POSTGRES_PASSWORD: meetbook_dev
      POSTGRES_DB: meetbook
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetbook -d meetbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "meetbook_dev"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "meetbook_dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: meetbook_minio
      MINIO_ROOT_PASSWORD: meetbook_minio_dev
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://meetbook:meetbook_dev@db:5432/meetbook
      REDIS_URL: redis://:meetbook_dev@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_EXTERNAL_ENDPOINT: http://${LAN_IP}:9100
      S3_BUCKET: meetbook-photos
      S3_ACCESS_KEY: meetbook_minio
      S3_SECRET_KEY: meetbook_minio_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - mediadata:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  mediadata:
