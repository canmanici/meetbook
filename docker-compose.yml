services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: meetbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetbook_dev}
      POSTGRES_DB: meetbook
    # 200 = backend pool (40 + 40 overflow) x a second container + tooling.
    # jit=off: plan compilation costs more than it saves on OLTP queries.
    command: ["postgres", "-c", "max_connections=200", "-c", "jit=off"]
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetbook -d meetbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-meetbook_dev}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-meetbook_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meetbook_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-meetbook_minio_dev}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dev TURN relay — same scheme as prod but with a fixed dev secret and the
  # LAN IP as the advertised host, so calls work between two phones on the
  # same network during development. Host networking (see prod file for why).
  coturn:
    image: coturn/coturn:4.6-alpine
    network_mode: host
    restart: unless-stopped
    command: >
      -n
      --listening-port=3478
      --fingerprint
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-meetbook_dev_turn}
      --realm=meetbook.dev
      --no-cli
      --no-multicast-peers
      --min-port=49160
      --max-port=49300
      --log-file=stdout

  backend:
    build: ./backend
    env_file: ./backend/.env

    environment:
      PYTHON_JIT: "1"
      DATABASE_URL: postgresql+asyncpg://meetbook:${POSTGRES_PASSWORD:-meetbook_dev}@db:5432/meetbook
      REDIS_URL: redis://:${REDIS_PASSWORD:-meetbook_dev}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_EXTERNAL_ENDPOINT: http://${LAN_IP}:9100
      S3_BUCKET: meetbook-photos
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-meetbook_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-meetbook_minio_dev}
      TURN_SECRET: ${TURN_SECRET:-meetbook_dev_turn}
      TURN_HOST: ${LAN_IP:-}
      TURN_PORT: "3478"
    ports:
      - "8000:8000"
    volumes:
      - ./admin:/app/admin:ro
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - mediadata:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  mediadata:
