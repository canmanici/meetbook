services:
  db:
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: meetbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meetbook
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c wal_buffers=16MB
      -c max_worker_processes=4
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetbook -d meetbook"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: https://canmanici.com/meetbook/admin/minio
    ports:
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # https://canmanici.com/meetbook/storage/<bucket>/<key> -> minio's path-style S3 API at /<bucket>/<key>
      - traefik.http.routers.meetbook-storage.rule=Host(`canmanici.com`) && PathPrefix(`/meetbook/storage`)
      - traefik.http.routers.meetbook-storage.entrypoints=websecure
      - traefik.http.routers.meetbook-storage.tls.certresolver=letsencrypt
      - traefik.http.routers.meetbook-storage.priority=20
      - traefik.http.middlewares.meetbook-storage-strip.stripprefix.prefixes=/meetbook/storage
      - traefik.http.routers.meetbook-storage.middlewares=meetbook-storage-strip
      - traefik.http.services.meetbook-storage.loadbalancer.server.port=9000
      # https://canmanici.com/meetbook/admin/minio -> minio console at :9001
      - traefik.http.middlewares.minio-ipwhitelist.ipallowlist.sourcerange=127.0.0.1/32, YOUR_ADMIN_IP_HERE
      - traefik.http.routers.meetbook-minio-console.rule=Host(`canmanici.com`) && PathPrefix(`/meetbook/admin/minio`)
      - traefik.http.routers.meetbook-minio-console.entrypoints=websecure
      - traefik.http.routers.meetbook-minio-console.tls.certresolver=letsencrypt
      - traefik.http.routers.meetbook-minio-console.priority=20
      - traefik.http.middlewares.meetbook-minio-console-strip.stripprefix.prefixes=/meetbook/admin/minio
      - traefik.http.routers.meetbook-minio-console.middlewares=minio-ipwhitelist,meetbook-minio-console-strip
      - traefik.http.services.meetbook-minio-console.loadbalancer.server.port=9001

  # ── TURN relay for WebRTC calls (CGNAT traversal) ─────────────────────
  # host networking: TURN allocates a UDP port per relay session out of
  # min-port..max-port — mapping hundreds of ports through docker-proxy
  # would melt the host, host mode costs nothing. Traefik is NOT involved
  # (TURN is not HTTP). Requires firewall: 3478/udp+tcp, 49160-49600/udp.
  #
  # Auth is coturn's REST-API scheme (`use-auth-secret`): the backend mints
  # HMAC credentials that self-expire after 1h (see /chat/turn-credentials).
  # No static TURN password exists anywhere in the app — cracking the APK
  # yields nothing without a live authenticated account, and even then a
  # stolen credential dies within the hour.
  #
  # denied-peer-ip blocks relaying INTO private ranges — without it a
  # malicious client could use the relay to port-scan the docker network.
  coturn:
    image: coturn/coturn:4.6-alpine
    network_mode: host
    restart: unless-stopped
    command: >
      -n
      --listening-port=3478
      --fingerprint
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --realm=canmanici.com
      --no-cli
      --no-multicast-peers
      --no-tlsv1
      --no-tlsv1_1
      --min-port=49160
      --max-port=49600
      --user-quota=12
      --total-quota=1200
      --max-bps=1500000
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=100.64.0.0-100.127.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --log-file=stdout
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      # The admin panel (repo ./admin) is copied INTO the image — see the
      # `admin` stage in backend/Dockerfile. A host bind mount went stale
      # between Dokploy deploys and 404'd the panel.
      additional_contexts:
        admin: ./admin
    environment:
      PYTHON_JIT: "1"
      ENV: production
      DATABASE_URL: postgresql+asyncpg://meetbook:${POSTGRES_PASSWORD}@db:5432/meetbook
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_EXTERNAL_ENDPOINT: https://canmanici.com/meetbook/storage
      S3_BUCKET: meetbook-photos
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Must stay 1: WebSocket/call state is in-process (start_app.py logs
      # and ignores any other value). Scale by adding containers.
      UVICORN_WORKERS: "1"
      CORS_ORIGINS: https://canmanici.com
      GOOGLE_PLACES_KEY: ${GOOGLE_PLACES_KEY:-}
      SMS_PROVIDER_KEY: ${SMS_PROVIDER_KEY:-}
      TURN_SECRET: ${TURN_SECRET}
      TURN_HOST: ${TURN_HOST:-canmanici.com}
      TURN_PORT: "3478"
      # Sign in with Google — the WEB OAuth client ID (token audience).
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      # Outgoing mail (verification / reset codes, KVKK). Empty SMTP_HOST =
      # no mail sent and email verification not enforced.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-MeetBook <no-reply@canmanici.com>}
      KVKK_CONTROLLER_EMAIL: ${KVKK_CONTROLLER_EMAIL:-}
      # Bootstrap admin (scripts/seed.py). No password = not created; the
      # password is re-synced on every deploy, so rotating = change + redeploy.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@meetbook.app}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # Existing accounts to grant admin (comma-separated).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    volumes:
      - mediadata:/app/media
      # DB-IP databases (~140 MB) — persisted so a redeploy doesn't re-download.
      - ipdb:/app/ipdb
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          memory: 512M
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # https://canmanici.com/meetbook/api/v1/... -> backend's /api/v1/... (also covers /media, /ws/chat, /api/docs)
      - traefik.http.routers.meetbook-api.rule=Host(`canmanici.com`) && PathPrefix(`/meetbook`)
      - traefik.http.routers.meetbook-api.entrypoints=websecure
      - traefik.http.routers.meetbook-api.tls.certresolver=letsencrypt
      - traefik.http.routers.meetbook-api.priority=10
      - traefik.http.middlewares.meetbook-api-strip.stripprefix.prefixes=/meetbook
      - traefik.http.routers.meetbook-api.middlewares=meetbook-api-strip
      - traefik.http.services.meetbook-api.loadbalancer.server.port=8000

networks:
  default:
    name: dokploy-network
    external: true

volumes:
  pgdata:
  redisdata:
  miniodata:
  ipdb:
  mediadata:
