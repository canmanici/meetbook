# Development override — auto-restarts backend on code changes.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# What this changes vs production:
#   1. Mounts source code as WRITABLE (not :ro)
#   2. Sets ENV=development so start.sh uses file watcher
#   3. Watches app/, scripts/, alembic/ for changes → auto-restarts uvicorn
#   4. No image rebuild needed — just edit and save

services:
  backend:
    # Install dev dependencies (watchfiles) before starting
    entrypoint: ["sh", "-c", "uv sync && exec uv run --no-dev python scripts/start_app.py"]
    environment:
      PYTHON_JIT: "1"
      ENV: development
      PYTHONDONTWRITEBYTECODE: "1"
      # Real SMTP delivery into the local Mailpit catcher (inbox UI: http://localhost:8025)
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      KVKK_CONTROLLER_EMAIL: kvkk@meetbook.local
    volumes:
      # Writable source mount — overrides the :ro in docker-compose.yml
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro
      # Admin panel (read-only, served as static by FastAPI)
      - ./admin:/app/admin:ro
      # Keep media volume for uploads
      - mediadata:/app/media

  # Local mail catcher — every email the backend sends lands here.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web inbox
      - "1025:1025"   # SMTP
